<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e86a92">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Un calendario de adviento virtual: 24 puertas, una sorpresa cada día de diciembre.">
<title>Calendario de adviento virtual</title>
<style id="tv-css-base">
/* Estilos base del motor: neutros y de baja especificidad (:where) para que cada estilo los cambie sin pelear. */
*, *::before, *::after { box-sizing: border-box; }
:where(html) { -webkit-text-size-adjust: 100%; }
:where(body) {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: #222;
  background: #f4f4f5;
  line-height: 1.45;
}
:where(#tv-escena) { display: block; width: 100%; max-width: 100%; overflow-x: hidden; }
:where(.tv-puertas) { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding: 0 16px; }
:where(.tv-puerta) {
  font: inherit; color: inherit; cursor: pointer;
  min-width: 0; min-height: 44px; padding: 0; margin: 0;
  -webkit-tap-highlight-color: transparent;
}
:where(.tv-puerta[data-estado="bloqueada"]) { cursor: not-allowed; }
:where(.tv-puerta:focus-visible), :where(.tv-cerrar:focus-visible), :where(.tv-boton:focus-visible) {
  outline: 3px solid #1a73e8; outline-offset: 3px;
}
.tv-cuenta[hidden] { display: none !important; }

/* Capa de efectos (alAbrir) */
.tv-capa { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }

/* Ventana de la sorpresa */
.tv-modal {
  position: fixed; inset: 0; z-index: 100;
  display: none; align-items: center; justify-content: center;
  padding: 16px;
}
.tv-modal.on { display: flex; }
:where(.tv-modal) { background: rgba(20, 20, 25, .55); }
:where(.tv-tarjeta) {
  position: relative; width: 100%; max-width: 420px;
  max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px); overflow: auto;
  background: #fff; color: #222; border-radius: 16px; padding: 24px 20px 20px;
  box-shadow: 0 12px 40px rgba(0,0,0,.25); text-align: center;
}
:where(.tv-tarjeta):focus { outline: none; }
:where(.tv-dia) { margin: 0 0 12px; font-size: 1.4rem; }
:where(.tv-contenido) { margin: 0 0 16px; }
:where(.tv-msg) { margin: 0; font-size: 1.1rem; }
:where(.tv-foto) { margin: 0; }
:where(.tv-foto img) { display: block; width: 100%; height: auto; border-radius: 10px; }
:where(.tv-foto figcaption) { margin-top: 8px; font-size: .95rem; }
:where(.tv-vale) { border: 2px dashed #999; border-radius: 12px; padding: 18px 12px; }
:where(.tv-vale-por) { font-size: .9rem; text-transform: uppercase; letter-spacing: .12em; }
:where(.tv-vale-que) { font-size: 1.5rem; font-weight: 700; margin: 4px 0; }
:where(.tv-vale-nota), :where(.tv-regalo-nota) { font-size: .85rem; opacity: .8; margin: 6px 0 0; }
:where(.tv-cancion-titulo) { font-size: 1.25rem; font-weight: 700; margin: 0 0 12px; }
:where(.tv-cancion-nota) { font-size: .95rem; margin: 0 0 14px; }
:where(.tv-regalo-texto) { font-size: 1.2rem; font-weight: 700; margin: 0; }
:where(.tv-firma) { margin: 0 0 16px; font-style: italic; opacity: .85; }
/* Saltos de línea del editor y palabras largas (risas, enlaces) sin desbordar la tarjeta */
:where(.tv-msg, .tv-vale-nota, .tv-regalo-nota, .tv-cancion-nota, .tv-foto figcaption, .tv-regalo-texto) { white-space: pre-line; }
:where(.tv-tarjeta), :where(.tv-para) { overflow-wrap: anywhere; }
:where(.tv-boton), :where(.tv-cerrar) {
  display: inline-block; font: inherit; font-weight: 600; cursor: pointer;
  min-height: 44px; padding: 10px 22px; border-radius: 999px;
  border: 1px solid #333; background: #222; color: #fff; text-decoration: none;
}
:where(.tv-cerrar) { background: #fff; color: #222; }

/* Aviso corto */
:where(.tv-toast) {
  position: fixed; left: 50%; bottom: 76px; z-index: 110;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  max-width: calc(100% - 32px); width: max-content;
  background: #222; color: #fff; padding: 10px 16px; border-radius: 10px;
  font-size: .95rem; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,.25);
  transition: opacity .2s, transform .2s;
}
:where(.tv-toast.on) { opacity: 1; transform: translate(-50%, 0); }
body.tv-modal-abierto { overflow: hidden; }

/* Barra de prueba (solo en la demo). Ids para que ningún estilo la toque. */
#tv-barra {
  position: fixed; right: 12px; bottom: 12px; z-index: 90;
  font: 14px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: #222; text-align: left; letter-spacing: normal; text-transform: none;
  max-width: calc(100% - 24px);
}
#tv-barra[hidden] { display: none; }
#tv-barra #tv-barra-abrir {
  all: unset; box-sizing: border-box; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 40px; padding: 8px 14px; border-radius: 999px;
  background: #fff; color: #222; border: 1px solid #d4d4d8;
  box-shadow: 0 4px 14px rgba(0,0,0,.18); font: 600 14px/1 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  float: right;
}
#tv-barra #tv-barra-abrir:focus-visible, #tv-barra button:focus-visible, #tv-barra select:focus-visible, #tv-barra input:focus-visible {
  outline: 2px solid #1a73e8; outline-offset: 2px;
}
#tv-barra #tv-barra-panel {
  clear: both; margin-bottom: 8px; width: 340px; max-width: 100%;
  background: #fff; border: 1px solid #d4d4d8; border-radius: 14px;
  box-shadow: 0 8px 28px rgba(0,0,0,.2); padding: 12px;
}
#tv-barra.cerrada #tv-barra-panel { display: none; }
#tv-barra .tvb-titulo { margin: 0 0 8px; font-size: 12px; font-weight: 700; color: #71717a; text-transform: uppercase; letter-spacing: .06em; }
#tv-barra .tvb-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
#tv-barra .tvb-chip {
  all: unset; box-sizing: border-box; cursor: pointer;
  display: inline-flex; align-items: center; gap: 5px;
  min-height: 34px; padding: 6px 10px; border-radius: 999px;
  border: 1px solid #d4d4d8; background: #fafafa; color: #222;
  font: 500 13px/1 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
#tv-barra .tvb-chip[aria-pressed="true"] { border-color: var(--tvb-color, #222); background: #fff; box-shadow: inset 0 0 0 1px var(--tvb-color, #222); font-weight: 700; }
#tv-barra .tvb-fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
#tv-barra label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font: 400 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #222; }
#tv-barra input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: #222; }
#tv-barra select {
  font: 400 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #222;
  min-height: 32px; padding: 4px 6px; border: 1px solid #d4d4d8; border-radius: 8px; background: #fff;
}
#tv-barra .tvb-reiniciar {
  all: unset; box-sizing: border-box; cursor: pointer; margin-left: auto;
  min-height: 32px; padding: 6px 12px; border-radius: 8px; border: 1px solid #d4d4d8; background: #fff; color: #b42318;
  font: 600 13px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
#tv-barra .tvb-nota { margin: 8px 0 0; font-size: 12px; color: #71717a; }
@media (min-width: 720px) {
  #tv-barra { right: 16px; bottom: 16px; }
}

/* Pantalla de espera y de avisos del calendario personalizado (neutra, igual para todos los estilos) */
#tv-estado {
  position: fixed; inset: 0; z-index: 120;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px; overflow-y: auto;
  background: linear-gradient(160deg, #fdf0f5 0%, #f6f4f8 50%, #eef3fb 100%);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color: #27272a; text-align: center; letter-spacing: normal; text-transform: none;
}
#tv-estado[hidden] { display: none; }
#tv-estado .tve-caja {
  width: 100%; max-width: 380px; margin: auto;
  background: #fff; border-radius: 20px; padding: 32px 24px 28px;
  box-shadow: 0 10px 36px rgba(60, 40, 80, .12);
}
#tv-estado .tve-icono { font-size: 44px; line-height: 1; margin: 0 0 14px; }
#tv-estado .tve-icono:empty { display: none; }
#tv-estado .tve-spinner {
  width: 40px; height: 40px; margin: 4px auto 18px; border-radius: 50%;
  border: 4px solid #f1d5e0; border-top-color: #d6336c;
  animation: tve-girar .9s linear infinite;
}
#tv-estado .tve-spinner[hidden] { display: none; }
#tv-estado .tve-titulo { margin: 0; font-size: 1.25rem; font-weight: 700; color: #18181b; }
#tv-estado .tve-texto { margin: 10px 0 0; color: #52525b; }
#tv-estado .tve-texto:empty { display: none; }
#tv-estado .tve-boton {
  all: unset; box-sizing: border-box; cursor: pointer; margin-top: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 44px; padding: 10px 24px; border-radius: 999px;
  background: #d6336c; color: #fff; font: 600 15px/1 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
#tv-estado .tve-boton[hidden] { display: none; }
#tv-estado .tve-boton:focus-visible { outline: 3px solid #1a73e8; outline-offset: 3px; }
@keyframes tve-girar { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  #tv-estado .tve-spinner { animation-duration: 2.4s; }
}
</style>
<style id="tv-css-tema"></style>
</head>
<body class="tema-kawaii">
<main id="tv-escena" aria-live="off"></main>
<div class="tv-capa" aria-hidden="true"></div>
<div class="tv-modal" aria-hidden="true">
  <div class="tv-tarjeta" role="dialog" aria-modal="true" aria-labelledby="tv-dia" tabindex="-1">
    <h2 class="tv-dia" id="tv-dia"></h2>
    <div class="tv-contenido"></div>
    <p class="tv-firma"></p>
    <button type="button" class="tv-cerrar">Cerrar</button>
  </div>
</div>
<div class="tv-toast" role="status" aria-live="polite"></div>
<div id="tv-estado" role="status" aria-live="polite" hidden>
  <div class="tve-caja">
    <div class="tve-icono" aria-hidden="true"></div>
    <div class="tve-spinner" aria-hidden="true" hidden></div>
    <h1 class="tve-titulo"></h1>
    <p class="tve-texto"></p>
    <button type="button" class="tve-boton" hidden>Intentar otra vez</button>
  </div>
</div>
<div id="tv-barra" class="tv-barra cerrada" role="region" aria-label="Opciones de prueba">
  <div id="tv-barra-panel">
    <p class="tvb-titulo">Estilo</p>
    <div class="tvb-chips" id="tvb-chips"></div>
    <div class="tvb-fila">
      <label><input type="checkbox" id="tvb-prueba"> Abrir todas (prueba)</label>
      <label>Simular día
        <select id="tvb-dia"></select>
      </label>
      <button type="button" class="tvb-reiniciar" id="tvb-reiniciar">Reiniciar</button>
    </div>
    <p class="tvb-nota">Vista de prueba: esta barra no aparece en el calendario que se entrega.</p>
  </div>
  <button type="button" id="tv-barra-abrir" aria-expanded="false" aria-controls="tv-barra-panel">⚙️ <span id="tvb-resumen">Demo</span></button>
</div>

<script src="temas/kawaii.js"></script>

    "Que hoy te pase algo que te haga sonreír sin razón. ✨",
    "Gracias por ser como eres. El mundo es más bonito contigo.",
    "Respira hondo, tómate un cafecito y regálate un rato para ti. ☕",
    "Ojalá sepas cuánto alegras los días de quienes te quieren.",
    "Una sonrisa tuya vale más que todas las luces de Navidad. 💡",
    "Hoy toca abrazo, aunque sea a la distancia. 🤗",
    "Eres de esas personas que hacen que todo valga la pena.",
    "Que no te falten motivos para reír ni personas con quienes hacerlo.",
    "Pequeño recordatorio: lo estás haciendo muy bien. 💪",
    "Ya vamos por la mitad del camino. ¡Lo mejor está por venir!",
    "Que la magia de estos días te encuentre en cada esquina. 🌟",
    "Hoy es un buen día para hacer algo que te guste mucho.",
    "Gracias por cada momento compartido este año. ❤️",
    "Que tus deseos de Navidad empiecen a cumplirse desde hoy.",
    "Eres un regalo para quienes tenemos la suerte de conocerte. 🎁",
    "Pon tu canción favorita y baila un ratito. 🎶",
    "Que todo el cariño que das te vuelva multiplicado.",
    "Faltan poquitos días: disfruta cada uno. ⏳",
    "Que la paz y la alegría de estos días se queden contigo todo el año.",
    "Ya casi llega la Navidad. Gracias por estar. 🕯️",
    "Mañana es Nochebuena: que tu casa se llene de abrazos y risas. 🏠",
    "¡Feliz Navidad! Que este día esté lleno de amor, paz y alegría. 🎄❤️"
  ];
  var RE_FOTO = /^data:image\/(webp|jpeg|png|svg\+xml)[;,]/i;

  function texto(v, max) {
    if (typeof v !== "string") return "";
    v = v.trim();
    return v.length > (max || 2000) ? v.slice(0, max || 2000) : v;
  }
  function urlSegura(v) {
    v = texto(v, 2000);
    if (!/^https?:\/\//i.test(v)) return "";
    try { var u = new URL(v); return (u.protocol === "http:" || u.protocol === "https:") ? u.href : ""; } catch (e) { return ""; }
  }
  function normalizarDia(d, n) {
    var r = null;
    if (d && typeof d === "object") {
      switch (d.tipo) {
        case "mensaje":
          if (texto(d.texto)) r = { tipo: "mensaje", texto: texto(d.texto) };
          break;
        case "foto":
          if (typeof d.foto === "string" && RE_FOTO.test(d.foto)) {
            var pie = texto(d.pie, 300);
            r = { tipo: "foto", img: d.foto, alt: pie || "Foto del día " + n, pie: pie };
          }
          break;
        case "vale":
          if (texto(d.que, 200)) r = { tipo: "vale", que: texto(d.que, 200), nota: texto(d.nota, 500) };
          break;
        case "cancion":
          r = { tipo: "cancion", titulo: texto(d.titulo, 200) || "Nuestra canción", url: urlSegura(d.url), nota: texto(d.nota, 500) };
          break;
        case "regalo":
          r = { tipo: "regalo", texto: texto(d.texto, 300) || "Hoy te espera un regalo de verdad 🎁", nota: texto(d.nota, 500) };
          break;
      }
    }
    if (!r) r = { tipo: "mensaje", texto: GENERICOS[n - 1] };
    if (n === 24) r.final = true;
    return r;
  }
  function normalizar(p) {
    if (!p || typeof p !== "object" || Array.isArray(p)) throw new Error("formato");
    var lista = Array.isArray(p.dias) ? p.dias : [];
    var dias = [null];
    for (var n = 1; n <= 24; n++) dias.push(normalizarDia(lista[n - 1], n));
    var anio = Number(p.anio);
    return {
      estilo: ORDEN_TEMAS.indexOf(p.estilo) >= 0 ? p.estilo : "kawaii",
      para: texto(p.para, 60),
      de: texto(p.de, 60),
      anio: (anio % 1 === 0 && anio >= 2020 && anio <= 2100) ? anio : fechaLima().y,
      dias: dias
    };
  }
  /* Pone en marcha un calendario ya validado (personalizado o vista previa) */
  function usarCalendario(cal) {
    DIAS = cal.dias;
    PARA = cal.para;
    DE = cal.de;
    ANIO = cal.anio;
    window.TV_MOTOR.dias = DIAS;
    abiertas = leerAbiertas();
    if (!tema || tema.id !== cal.estilo || !buscarTema(cal.estilo)) aplicarTema(cal.estilo);
    else { pintarTodo(); pintarBarra(); }
    /* Vista previa con la tarjeta abierta: actualizar lo que se ve */
    if (modal.classList.contains("on")) {
      var n = parseInt(modal.getAttribute("data-n"), 10);
      if (DIAS[n]) {
        pintarContenido(n);
        contenido.setAttribute("data-tipo", DIAS[n].tipo);
        modal.setAttribute("data-tipo", DIAS[n].tipo);
        firmaEl.textContent = DE ? "Con cariño, " + DE : "Con cariño";
      }
    }
  }

  /* Pantalla de espera / avisos */
  var estadoEl = document.getElementById("tv-estado");
  var reintentarBtn = $(".tve-boton", estadoEl);
  var AVISOS = {
    cargando: { icono: "", spinner: true, titulo: "Preparando tu calendario…", texto: "" },
    incompleto: { icono: "🔗", titulo: "Falta una parte del enlace", texto: "Este enlace está incompleto. Pídele a quien te lo regaló que te lo vuelva a enviar." },
    noEncontrado: { icono: "🔍", titulo: "No encontramos este calendario", texto: "Revisa que el enlace esté completo. Si sigue sin abrir, pídele a quien te lo regaló que te lo vuelva a enviar." },
    red: { icono: "📶", titulo: "No pudimos cargar tu calendario", texto: "Revisa tu conexión a internet e inténtalo otra vez.", reintentar: true },
    descifrar: { icono: "🔒", titulo: "No se pudo abrir el calendario…", texto: "Es posible que el enlace se haya copiado incompleto. Pídele a quien te lo regaló que te lo vuelva a enviar." },
    navegador: { icono: "🧭", titulo: "Tu navegador no puede abrirlo", texto: "Abre el enlace en Chrome, Safari o Edge actualizados." }
  };
  function mostrarEstado(clave) {
    var a = AVISOS[clave];
    $(".tve-icono", estadoEl).textContent = a.icono;
    $(".tve-spinner", estadoEl).hidden = !a.spinner;
    $(".tve-titulo", estadoEl).textContent = a.titulo;
    $(".tve-texto", estadoEl).textContent = a.texto;
    reintentarBtn.hidden = !a.reintentar;
    estadoEl.setAttribute("data-estado", clave);
    estadoEl.hidden = false;
    escenaEl.setAttribute("inert", ""); escenaEl.inert = true;
    if (a.reintentar) setTimeout(function () { reintentarBtn.focus(); }, 0);
  }
  function ocultarEstado() {
    estadoEl.hidden = true;
    escenaEl.removeAttribute("inert"); escenaEl.inert = false;
  }

  function desdeBase64url(s) {
    var b = s.replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    var bin = atob(b), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }
  /* La clave solo se lee del fragmento (#k=...): nunca se envía ni se escribe en ningún lado */
  function leerClave() {
    var m = /(?:^#|&)k=([A-Za-z0-9_-]{43})(?:&|$)/.exec(location.hash || "");
    if (!m) return null;
    try { var k = desdeBase64url(m[1]); return k.length === 32 ? k : null; } catch (e) { return null; }
  }

  function abrirPersonal() {
    barra.hidden = true;
    mostrarEstado("cargando");
    var clave = leerClave();
    if (!clave) { mostrarEstado("incompleto"); return; }
    if (!/^[a-z0-9]{10}$/.test(CAL_ID)) { mostrarEstado("noEncontrado"); return; }
    var sutil = window.crypto && window.crypto.subtle;
    if (!sutil || !window.fetch || !window.TextDecoder) { mostrarEstado("navegador"); return; }
    fetch("c/" + CAL_ID + ".bin", { cache: "no-store", credentials: "omit", referrerPolicy: "no-referrer" })
      .then(function (r) {
        if (r.status === 404 || r.status === 410) throw { aviso: "noEncontrado" };
        if (!r.ok) throw { aviso: "red" };
        return r.arrayBuffer().catch(function () { throw { aviso: "red" }; });
      }, function () { throw { aviso: "red" }; })
      .then(function (buf) {
        var b = new Uint8Array(buf);
        if (b.length < 4 + 12 + 16 || b[0] !== 65 || b[1] !== 68 || b[2] !== 86 || b[3] !== 49) throw { aviso: "descifrar" };
        return sutil.importKey("raw", clave, { name: "AES-GCM" }, false, ["decrypt"])
          .then(function (k) { return sutil.decrypt({ name: "AES-GCM", iv: b.slice(4, 16) }, k, b.slice(16)); })
          .then(function (plano) {
            return normalizar(JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(plano)));
          })
          .catch(function () { throw { aviso: "descifrar" }; });
      })
      .then(function (cal) {
        CLAVE = "tv-abiertas-" + CAL_ID;
        barra.hidden = !estado.barra;
        usarCalendario(cal);
        ocultarEstado();
      })
      .catch(function (e) {
        mostrarEstado(e && AVISOS[e.aviso] ? e.aviso : "descifrar");
      });
  }
  reintentarBtn.addEventListener("click", function () { if (MODO === "personal") abrirPersonal(); });

  /* Vista previa: el editor (misma página de origen, ventana madre) manda {tipo:"tv-vista", datos:{...}} */
  var pendiente = null;
  function abrirVista() {
    barra.hidden = true;
    usarCalendario(normalizar({ estilo: "kawaii", dias: [] }));
    window.addEventListener("message", function (e) {
      if (e.source !== window.parent || e.origin !== location.origin) return;
      var m = e.data;
      if (!m || m.tipo !== "tv-vista" || !m.datos || typeof m.datos !== "object") return;
      var cal;
      try { cal = normalizar(m.datos); } catch (err) { return; }
      /* Si una puerta se está abriendo, se aplica al terminar (solo el último envío) */
      if (ocupado) {
        var nuevo = !pendiente; pendiente = cal;
        if (nuevo) (function esperar() {
          if (ocupado) { setTimeout(esperar, 150); return; }
          var c = pendiente; pendiente = null; usarCalendario(c);
        })();
        return;
      }
      pendiente = null;
      usarCalendario(cal);
    });
    /* Aviso opcional al editor: la vista ya escucha */
    try { if (window.parent !== window) window.parent.postMessage({ tipo: "tv-vista-lista" }, location.origin); } catch (e) { /* sin madre */ }
  }

  if (MODO === "personal") abrirPersonal();
  else if (MODO === "vista") abrirVista();
  else {
    aplicarTema(estado.estilo);
    actualizarURL();
  }
})();
</script>
